}</style><style type="text/css" data-vite-dev-id="/mnt/newdisk/vue-fastapi-admin/web/src/styles/tokens-primitives.css">/**
 * 设计令牌 · 原始层(Primitives)——固化自 Open Props v1.7.23
 * 来源: https://github.com/argyleink/open-props (MIT License)
 * 需求12(2026-07-24):开源令牌库直接应用主程序。
 *
 * ⚠️ 为什么固化而不是 npm 引入:本项目 html{font-size:4px}(unocss 换算 hack),
 * Open Props 的 rem 值会被缩成 1/4。此处 rem 已按其设计基准 16px 换算成 px;
 * 尺寸阶梯直接采用 Open Props 原生的 --size-px-* 系列。升级方法:拉新版 tarball
 * 对照本文件各段重新换算(值极稳定,多年未变)。
 *
 * 分层约定:本文件只放"原料"(色阶/字阶/间距/圆角/阴影/缓动),业务代码
 * **不得直接引用** --gray-3 这类原始变量;一律经 design-tokens.css 的语义层
 * (--text-secondary 等)取用。规范见 docs/design-system.md。
 */
:root {
  /* ── 色阶(Open Color 体系,0=最浅 12=最深) ─────────────────── */
  --gray-0: #f8f9fa;
  --gray-1: #f1f3f5;
  --gray-2: #e9ecef;
  --gray-3: #dee2e6;
  --gray-4: #ced4da;
  --gray-5: #adb5bd;
  --gray-6: #868e96;
  --gray-7: #495057;
  --gray-8: #343a40;
  --gray-9: #212529;
  --gray-10: #16191d;
  --gray-11: #0d0f12;
  --gray-12: #030507;

  --blue-0: #e7f5ff;
  --blue-1: #d0ebff;
  --blue-2: #a5d8ff;
  --blue-3: #74c0fc;
  --blue-4: #4dabf7;
  --blue-5: #339af0;
  --blue-6: #228be6;
  --blue-7: #1c7ed6;
  --blue-8: #1971c2;
  --blue-9: #1864ab;
  --blue-10: #145591;
  --blue-11: #114678;
  --blue-12: #0d375e;

  --red-0: #fff5f5;
  --red-1: #ffe3e3;
  --red-2: #ffc9c9;
  --red-3: #ffa8a8;
  --red-4: #ff8787;
  --red-5: #ff6b6b;
  --red-6: #fa5252;
  --red-7: #f03e3e;
  --red-8: #e03131;
  --red-9: #c92a2a;
  --red-10: #b02525;
  --red-11: #962020;
  --red-12: #7d1a1a;

  --green-0: #ebfbee;
  --green-1: #d3f9d8;
  --green-2: #b2f2bb;
  --green-3: #8ce99a;
  --green-4: #69db7c;
  --green-5: #51cf66;
  --green-6: #40c057;
  --green-7: #37b24d;
  --green-8: #2f9e44;
  --green-9: #2b8a3e;
  --green-10: #237032;
  --green-11: #1b5727;
  --green-12: #133d1b;

  --yellow-0: #fff9db;
  --yellow-1: #fff3bf;
  --yellow-2: #ffec99;
  --yellow-3: #ffe066;
  --yellow-4: #ffd43b;
  --yellow-5: #fcc419;
  --yellow-6: #fab005;
  --yellow-7: #f59f00;
  --yellow-8: #f08c00;
  --yellow-9: #e67700;
  --yellow-10: #b35c00;
  --yellow-11: #804200;
  --yellow-12: #663500;

  /* ── 间距阶梯(Open Props --size-px-*,4px 起步) ─────────────── */
  --size-1: 4px;
  --size-2: 8px;
  --size-3: 16px;
  --size-4: 20px;
  --size-5: 24px;
  --size-6: 28px;
  --size-7: 32px;
  --size-8: 48px;
  --size-9: 64px;
  --size-10: 80px;
  --size-11: 120px;
  --size-12: 160px;

  /* ── 字号阶梯(rem→px @16px 基准) ───────────────────────────── */
  --scale-font-00: 8px; /* .5rem  */
  --scale-font-0: 12px; /* .75rem */
  --scale-font-1: 16px; /* 1rem   */
  --scale-font-2: 17.6px; /* 1.1rem */
  --scale-font-3: 20px; /* 1.25rem */
  --scale-font-4: 24px; /* 1.5rem */
  --scale-font-5: 32px; /* 2rem   */
  --scale-font-6: 40px; /* 2.5rem */

  /* ── 字重 / 行高 ────────────────────────────────────────────── */
  --font-weight-4: 400;
  --font-weight-5: 500;
  --font-weight-6: 600;
  --font-weight-7: 700;
  --font-lineheight-0: 1.1;
  --font-lineheight-1: 1.25;
  --font-lineheight-2: 1.375;
  --font-lineheight-3: 1.5;
  --font-lineheight-4: 1.75;

  /* ── 圆角(rem→px @16px 基准) ──────────────────────────────── */
  --radius-1: 2px;
  --radius-2: 5px;
  --radius-3: 16px; /* 1rem */
  --radius-4: 32px; /* 2rem */
  --radius-round: 1e5px;

  /* ── 阴影(Open Props 层次阴影,px 偏移 + 可调强度) ─────────── */
  --shadow-color: 220 3% 15%;
  --shadow-strength: 1%;
  --shadow-1: 0 1px 2px -1px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 9%));
  --shadow-2:
    0 3px 5px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 3%)),
    0 7px 14px -5px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 5%));
  --shadow-3:
    0 -1px 3px 0 hsl(var(--shadow-color) / calc(var(--shadow-strength) + 2%)),
    0 1px 2px -5px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 2%)),
    0 2px 5px -5px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 4%)),
    0 4px 12px -5px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 5%)),
    0 12px 15px -5px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 7%));
  --shadow-4:
    0 -2px 5px 0 hsl(var(--shadow-color) / calc(var(--shadow-strength) + 2%)),
    0 1px 1px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 3%)),
    0 2px 2px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 3%)),
    0 5px 5px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 4%)),
    0 9px 9px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 5%)),
    0 16px 16px -2px hsl(var(--shadow-color) / calc(var(--shadow-strength) + 6%));

  /* ── 缓动 ───────────────────────────────────────────────────── */
  --ease-1: cubic-bezier(0.25, 0, 0.5, 1);
  --ease-2: cubic-bezier(0.25, 0, 0.4, 1);
  --ease-3: cubic-bezier(0.25, 0, 0.3, 1);
  --ease-out-3: cubic-bezier(0, 0, 0.3, 1);
  --ease-in-out-3: cubic-bezier(0.5, 0, 0.3, 1);
}
</style><style type="text/css" data-vite-dev-id="/mnt/newdisk/vue-fastapi-admin/web/src/styles/design-tokens.css">/**
 * 设计资源库 · 语义层(Semantic Tokens)
 *
 * 二层结构(需求8+12,2026-07-24):
 *   tokens-primitives.css(原始层,固化自 Open Props v1.7.23,MIT)
 *     └─ 本文件(语义层)——业务代码唯一允许引用的一层
 *
 * 用法:新写/改造的样式一律取本文件的 var(--xx),不写魔法数,也不直接用
 * --gray-3 这类原始变量。naive-ui 组件继续用其 size 属性,场景对照见
 * docs/design-system.md。主题色由 AppProvider 从 web/settings/theme.json
 * 注入 --primary-color 等(蓝 #2563EB,用户已验收),此处不重复定义。
 */
:root {
  /* ── 字号(正文 14 基准;可映射项引用原始层字阶) ──────────── */
  --font-size-xs: 11px; /* 徽标/图表刻度等极小注记 */
  --font-size-sm: var(--scale-font-0); /* 12px 辅助说明、表格次要信息、tag */
  --font-size-base: 14px; /* 正文、表单、表格主体 */
  --font-size-md: 15px; /* 卡片/折叠块标题 */
  --font-size-lg: var(--scale-font-1); /* 16px 区块标题 */
  --font-size-xl: var(--scale-font-3); /* 20px 页面标题 */

  /* ── 字重 / 行高(引用原始层) ─────────────────────────────── */
  --font-weight-regular: var(--font-weight-4);
  --font-weight-medium: var(--font-weight-5); /* 标签、次级标题 */
  --font-weight-semibold: var(--font-weight-6); /* 卡片/区块标题 */
  --line-height-tight: var(--font-lineheight-1);
  --line-height-body: var(--font-lineheight-3);

  /* ── 间距(4px 阶梯;可映射项引用原始层) ───────────────────── */
  --space-1: var(--size-1); /* 4px */
  --space-2: var(--size-2); /* 8px */
  --space-3: 12px;
  --space-4: var(--size-3); /* 16px */
  --space-5: var(--size-4); /* 20px */
  --space-6: var(--size-5); /* 24px */

  /* ── 圆角(既有验收观感,保持) ─────────────────────────────── */
  --radius-sm: 6px; /* tag、小输入件 */
  --radius-md: 8px; /* 常规卡片内块 */
  --radius-lg: 10px; /* 页面级卡片 */
  --radius-xl: 12px; /* 上传拖拽区等大容器 */

  /* ── 中性色(映射到 Open Props 灰阶,与既有惯用值最近档) ───── */
  --text-primary: var(--gray-8); /* 原 #333 → #343a40 */
  --text-secondary: var(--gray-7); /* 原 #555 → #495057 */
  --text-tertiary: var(--gray-6); /* 原 #888 → #868e96 */
  --text-disabled: var(--gray-5); /* 原 #aaa → #adb5bd */
  --border-light: var(--gray-2); /* 原 #eee → #e9ecef */
  --bg-hover: var(--gray-1); /* 原 #f5f5f5 → #f1f3f5 */
  --bg-page: var(--gray-0);

  /* 蓝调卡片组合:品牌蓝 #2563EB 的派生浅底,非 Open Props 蓝阶(其偏青) */
  --border-accent: #eaedff;
  --bg-card-accent: #f8faff;

  /* ── 状态色(与 theme.json naiveThemeOverrides 同源,仅作 CSS 引用) ── */
  --color-success: #18a058;
  --color-warning: #f0a020;
  --color-error: #d03050;
  /* 状态浅底(tag/提示条),取原始层浅档 */
  --bg-success-subtle: var(--green-0);
  --bg-warning-subtle: var(--yellow-0);
  --bg-error-subtle: var(--red-0);

  /* ── 阴影 / 缓动(直接采用原始层体系) ─────────────────────── */
  --shadow-subtle: var(--shadow-1); /* 静置卡片的极轻投影 */
  --shadow-card: var(--shadow-2); /* 常规卡片悬浮 */
  --shadow-hover: var(--shadow-2); /* 卡片 hover 抬升 */
  --shadow-pop: var(--shadow-3); /* 弹层/下拉 */
  --ease-ui: var(--ease-3); /* 常规过渡 */
  --duration-ui: 0.2s;

  /* ── 动效曲线(2026-08-03,emil-design-eng 准则:内置 CSS 缓动太弱) ──
     进出场一律 ease-out(起步快=响应感);屏内移动用 ease-in-out;
     禁止对 UI 元素用 ease-in;UI 动效时长不过 300ms。 */
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1); /* 进场/出场/交互默认 */
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1); /* 屏内移动/形变 */
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); /* 抽屉/侧滑(iOS 曲线) */
  --duration-press: 140ms; /* 按压反馈 */
  --duration-fast: 160ms; /* tooltip/小弹层 */
  --duration-panel: 260ms; /* modal/drawer 级 */
}

html {
  font-size: 4px;
}

body {
  font-size: 16px;
}

#app {
  width: 100%;
  height: 100%;
}

/* transition fade-slide(页面切换)
   2026-08-03 调速:300ms/30px → 进 200ms、出 150ms/12px,强 ease-out;
   只动 transform/opacity(GPU 通道),不再 all */
.fade-slide-enter-active {
  transition: opacity 0.2s var(--ease-out-strong), transform 0.2s var(--ease-out-strong);
}

.fade-slide-leave-active {
  transition: opacity 0.15s var(--ease-out-strong), transform 0.15s var(--ease-out-strong);
}

.fade-slide-enter-from {
  opacity: 0;
  transform: translateX(-12px);
}

.fade-slide-leave-to {
  opacity: 0;
  transform: translateX(12px);
}

/* ── 全站交互反馈(2026-08-03,emil 准则) ─────────────────────── */
/* 按钮按压反馈:界面在"听你说话"。重申 naive 的颜色过渡链再追加 transform,
   不能用 transition 简写覆盖(会杀掉 hover 变色过渡) */
.n-button {
  transition: color 0.3s var(--n-bezier), background-color 0.3s var(--n-bezier), opacity 0.3s var(--n-bezier), border-color 0.3s var(--n-bezier), transform var(--duration-press) var(--ease-out-strong);
}

.n-button:not(.n-button--disabled):not(.n-button--loading):active {
  transform: scale(0.97);
}

/* 可点卡片/列表项 hover 抬升:挂 .hover-lift 即得统一反馈(触屏不触发) */
.hover-lift {
  transition: box-shadow var(--duration-ui) var(--ease-out-strong), transform var(--duration-ui) var(--ease-out-strong);
}

@media (hover: hover) and (pointer: fine) {
  .hover-lift:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
}
/* 不走 AppPage 的整页外壳(chat/lineage/overview)进场:轻淡入,不位移大距离 */
.page-enter-soft {
  animation: page-fade-in 0.2s var(--ease-out-strong);
}

@keyframes page-fade-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
/* 无障碍:偏好减弱动效时全局收敛(保色彩/透明度语义,去位移) */
@media (prefers-reduced-motion: reduce) {

    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;

.cus-scroll {

.cus-scroll-y {
